name: Publikacja na GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalacja zależności
        working-directory: frontend
        run: npm ci

      - name: Budowanie strony
        working-directory: frontend
        env:
          VITE_BASE_PATH: /cyfrowe-panstwo-propozycja/
        run: npm run build

      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v5

      - name: Przekazanie plików strony
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Publikacja strony
        id: deployment
        uses: actions/deploy-pages@v4
