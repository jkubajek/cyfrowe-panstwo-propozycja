worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # ALB OIDC session cookies can be 10-15KB — increase header buffer to prevent
    # nginx from silently dropping requests with oversized Cookie headers.
    large_client_header_buffers 8 64k;

    # Resolve which Entra access token to send upstream.
    #
    # The browser's MSAL token is the credential that matters — it is the only one minted for
    # the upstream's audience. Some ALB listener rules add an authenticate-oidc action and
    # inject x-amzn-oidc-accesstoken; where that happens it is used as a last resort, but the
    # Coolify app domain forwards without OIDC, so on that host this branch never fires and a
    # missing MSAL token means a missing credential. Empty resolves to no header at all rather
    # than a bare "Bearer ".
    map $http_x_amzn_oidc_accesstoken $alb_authorization {
        default  "Bearer $http_x_amzn_oidc_accesstoken";
        ""       "";
    }
    map $http_authorization $upstream_authorization {
        default  $http_authorization;
        ""       $alb_authorization;
    }

    # Temp paths for non-root operation
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Frontend routes — SPA fallback (never long-cache HTML)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Health check
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
